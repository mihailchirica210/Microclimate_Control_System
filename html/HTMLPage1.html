<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Microclimate Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        .sensor {
            margin-bottom: 20px;
            font-size: 1.2em;
        }

        .fan {
            font-weight: bold;
            color: red;
        }
    </style>
</head>
<body>
    <h1>Microclimate Control Dashboard</h1>
    <div class="sensor" id="temp">Temperature: -- °C</div>
    <div class="sensor" id="hum">Humidity: -- %</div>
    <div class="sensor" id="aq">Air Quality: -- ppm</div>
    <div class="sensor fan" id="fan">Fan Status: --</div>

    <script>
        async function fetchData() {
            try {
                const res = await fetch('/current');
                const data = await res.json();

                document.getElementById('temp').textContent = `Temperature: ${data.temperature.toFixed(1)} °C`;
                document.getElementById('hum').textContent = `Humidity: ${data.humidity.toFixed(1)} %`;
                document.getElementById('aq').textContent = `Air Quality: ${data.air_quality} ppm`;

                const fanOn = data.temperature > 27 || data.humidity > 50 || data.air_quality > 100;
                document.getElementById('fan').textContent = `Fan Status: ${fanOn ? 'ON' : 'OFF'}`;
            } catch (err) {
                console.error(err);
            }
        }

        setInterval(fetchData, 1000);
        fetchData();
    </script>
</body>
</html>
